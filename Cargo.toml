[package]
name = "convertx"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = "0.38.0"
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp", "tga", "pnm", "qoi", "dds", "hdr", "exr"] }
oxipng = "10.2.1"
resvg = "0.49.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
which = "8.0.6"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
