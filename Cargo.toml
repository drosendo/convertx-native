[package]
name = "convertx"
version = "0.1.0"
edition = "2024"

[lib]
name = "convertx"
crate-type = ["rlib", "cdylib"]

[dependencies]
# accesskit conflicts with android-native-activity, so it is enabled per target.
eframe = { version = "0.37.0", default-features = false, features = [
  "clipboard",
  "default_fonts",
  "links",
  "system_fonts",
  "wayland",
  "web_screen_reader",
  "wgpu",
  "x11",
] }
calamine = "0.38.0"
chrono = "0.4.45"
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp", "tga", "pnm", "qoi", "dds", "hdr", "exr"] }
oxipng = "10.2.1"
resvg = "0.49.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
which = "8.0.6"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

# Desktop-only: native file dialogs.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit"] }
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
  "android-native-activity",
] }
winit = { version = "0.30", default-features = false, features = [
  "android-native-activity",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
